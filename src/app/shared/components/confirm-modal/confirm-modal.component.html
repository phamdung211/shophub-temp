@if (isOpen) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity"
    (click)="onCancel()">
    <!-- Modal Box: Chặn nổi bọt sự kiện click lên backdrop -->
    <div class="relative w-full max-w-md bg-white rounded-2xl p-6 shadow-2xl transition-all transform scale-100"
        (click)="$event.stopPropagation()">
        <div class="flex items-start gap-4">
            <!-- Icon Cảnh báo nổi bật -->
            <div class="flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center"
                [class]="isDanger ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'">
                @if (isDanger) {
                <span class="text-2xl">⚠️</span>
                } @else {
                <span class="text-2xl">ℹ️</span>
                }
            </div>

            <!-- Tiêu đề & Nội dung -->
            <div class="flex-1">
                <h3 class="text-lg font-bold text-gray-900">{{ title }}</h3>
                <p class="mt-2 text-sm text-gray-500 leading-relaxed">{{ message }}</p>
            </div>
        </div>

        <!-- Hàng nút hành động -->
        <div class="mt-6 flex items-center justify-end gap-3">
            <button type="button" (click)="onCancel()"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                {{ cancelText }}
            </button>

            <button type="button" (click)="onConfirm()"
                class="px-4 py-2 text-sm font-semibold text-white rounded-lg transition shadow-sm"
                [class]="isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'">
                {{ confirmText }}
            </button>
        </div>
    </div>
</div>
}
