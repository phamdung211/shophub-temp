<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a routerLink="/products" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
      <span>🛍️</span>
      <span>ShopHub</span>
    </a>

    <nav class="flex items-center gap-6 text-gray-600 font-medium">
      <a
        routerLink="/products"
        routerLinkActive="text-blue-600 font-semibold"
        class="transition hover:text-blue-600"
      >
        Sản phẩm
      </a>
      <a
        routerLink="/admin/products/create"
        routerLinkActive="text-blue-600 font-semibold"
        class="transition hover:text-blue-600"
      >
        Thêm sản phẩm
      </a>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Nút giả lập Đăng nhập / Đăng xuất để test authGuard -->
      <button
        type="button"
        (click)="toggleLogin()"
        [class]="authService.isLoggedIn()
          ? 'rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 text-xs font-semibold hover:bg-emerald-100 transition'
          : 'rounded-lg bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 text-xs font-semibold hover:bg-amber-100 transition'"
        title="Nhấn để đổi trạng thái đăng nhập test Auth Guard"
      >
        @if (authService.isLoggedIn()) {
          <span>🟢 Đã đăng nhập (Admin) - Click để Thoát</span>
        } @else {
          <span>🔒 Chưa đăng nhập - Click để Đăng nhập Demo</span>
        }
      </button>

      <a
        routerLink="/admin/products/create"
        class="rounded-lg bg-blue-50 px-4 py-2 text-sm font-semibold text-blue-600 transition hover:bg-blue-100"
      >
        + Thêm mới
      </a>

      <button
        type="button"
        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 flex items-center gap-2 shadow-sm"
      >
        <span>🛒</span>
        <span>Giỏ hàng</span>
      </button>
    </div>
  </div>
</header>
