<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none">
    @for (toast of toastService.toasts(); track toast.id) {
    <div class="pointer-events-auto flex items-center justify-between p-4 rounded-xl shadow-xl border bg-white text-gray-800 text-sm transition-all duration-300"
        [class]="{
        'border-gray-200 border-l-4 !border-l-emerald-500': toast.type === 'success',
        'border-gray-200 border-l-4 !border-l-rose-500': toast.type === 'error',
        'border-gray-200 border-l-4 !border-l-amber-500': toast.type === 'warning',
        'border-gray-200 border-l-4 !border-l-blue-500': toast.type === 'info'
      }">

        <div class="flex items-center gap-3">
            <span class="text-base">
                @switch (toast.type) {
                @case ('success') { ✅ }
                @case ('error') { ❌ }
                @case ('warning') { ⚠️ }
                @default { ℹ️ }
                }
            </span>
            <span class="font-medium leading-snug">{{ toast.message }}</span>
        </div>

        <!-- Nút tắt nhanh x -->
        <button type="button" (click)="toastService.remove(toast.id)"
            class="ml-3 text-gray-400 hover:text-gray-700 font-bold text-lg leading-none transition">
            &times;
        </button>
    </div>
    }
</div>
