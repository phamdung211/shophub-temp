<div class="border rounded-xl p-4">
  <img
    [src]="product.thumbnail"
    [alt]="product.title"
    class="w-full h-48 object-cover"
  />

  <h3 class="font-semibold mt-3">{{ product.title }}</h3>

  <p class="text-gray-600">{{ product.description }}</p>

  <p class="font-bold mt-2">{{ product.price | number }} ₫</p>

  <button
    type="button"
    (click)="onBuyClick()"
    class="mt-3 rounded-lg bg-blue-600 text-white px-4 py-2"
  >
    Mua
  </button>
</div>
