<article
  class="overflow-hidden rounded-xl bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg"
>
  <img [src]="imageUrl" [alt]="name" class="h-52 w-full object-cover" />

  <div class="p-4">
    <h2 class="text-lg font-semibold text-gray-800">
      {{ name }}
    </h2>

    <p class="mt-2 text-xl font-bold text-blue-600">{{ price | number }} ₫</p>

    <p
      class="mt-2 text-sm"
      [class.text-green-600]="inStock"
      [class.text-red-600]="!inStock"
    >
      {{ inStock ? "Còn hàng" : "Hết hàng" }}
    </p>
    <label for="quantity" class="mt-3 block text-sm text-gray-600">
      Số lượng
    </label>

    <input
      id="quantity"
      type="number"
      min="1"
      [(ngModel)]="quantity"
      class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"
    />
    <p>Số lượng đang chọn: {{ quantity }}</p>

    <button
      type="button"
      (click)="addToCart()"
      [disabled]="!inStock || quantity < 1"
      class="mt-4 w-full rounded-lg bg-blue-600 px-4 py-2 text-white disabled:bg-gray-300"
    >
      Thêm vào giỏ
    </button>
  </div>
</article>
