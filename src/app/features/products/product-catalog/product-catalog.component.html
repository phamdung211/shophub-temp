<h2 class="text-2xl font-bold mb-2">Sản phẩm nổi bật</h2>

<p class="mb-6">Khám phá các sản phẩm tại ShopHub.</p>

<app-product-filter-bar
  (searchChange)="onSearchChange($event)"
  (categoryChange)="onCategoryChange($event)"
/>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
  @for (item of filteredProducts; track item.id) {
    <app-product-card [product]="item" (addToCart)="handleAddToCart($event)" />
  } @empty {
    <p class="col-span-full text-center py-8">
      Không tìm thấy sản phẩm phù hợp.
    </p>
  }
</div>
