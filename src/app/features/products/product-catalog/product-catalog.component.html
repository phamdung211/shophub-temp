<section class="container mx-auto px-4 py-8">
  <h2 class="mb-2 text-2xl font-bold">Sản phẩm nổi bật</h2>

  <p class="mb-6 text-gray-600">Khám phá các sản phẩm tại ShopHub.</p>

  <div class="mb-6 flex flex-wrap gap-4">
    <input
      type="text"
      placeholder="Tìm kiếm sản phẩm..."
      class="rounded-lg border px-4 py-2"
      [value]="searchKeyword"
      (input)="onSearchChange($any($event.target).value)"
    />

    <select
      class="rounded-lg border px-4 py-2"
      [value]="selectedCategory"
      (change)="onCategoryChange($any($event.target).value)"
    >
      <option value="all">Tất cả danh mục</option>
      <option value="laptops">Laptop</option>
      <option value="accessories">Phụ kiện</option>
      <option value="smartphones">Điện thoại</option>
      <option value="fragrances">Nước hoa</option>
    </select>
  </div>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
    @for (product of filteredProducts; track product.id) {
      <app-product-card [product]="product" />
    } @empty {
      <p class="col-span-full py-8 text-center text-gray-500">
        Không tìm thấy sản phẩm phù hợp.
      </p>
    }
  </div>
</section>
