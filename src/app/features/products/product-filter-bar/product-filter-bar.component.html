<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <!-- Search Input with RxJS Live Search -->
  <div class="relative flex-1 max-w-md">
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </div>

    <input
      type="text"
      [formControl]="searchControl"
      placeholder="Tìm kiếm theo tên, mô tả hoặc thương hiệu..."
      class="w-full rounded-xl border border-gray-300 bg-white py-2.5 pl-10 pr-10 text-sm text-gray-900 placeholder-gray-400 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
    />

    @if (searchControl.value) {
      <button
        type="button"
        (click)="clearSearch()"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 transition"
        title="Xóa tìm kiếm"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }
  </div>

  <!-- Category Dropdown -->
  <div class="flex items-center gap-2">
    <label for="category-select" class="text-sm font-medium text-gray-700 whitespace-nowrap">
      Ngành hàng:
    </label>
    <select
      id="category-select"
      [(ngModel)]="selectedCategory"
      (ngModelChange)="onCategoryChange()"
      class="rounded-xl border border-gray-300 bg-white px-3.5 py-2.5 text-sm font-medium text-gray-700 shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 cursor-pointer"
    >
      @for (cat of categories; track cat.value) {
        <option [value]="cat.value">{{ cat.label }}</option>
      }
    </select>
  </div>
</div>
