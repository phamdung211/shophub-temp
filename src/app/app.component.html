@if (loadingService.isLoading()) {
<div class="fixed top-0 left-0 right-0 z-[9999] h-1.5 bg-indigo-100/60 overflow-hidden">
    <div class="h-full w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-pink-500 animate-pulse shadow-sm"></div>
</div>
}

<div
    class="min-h-screen flex flex-col bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200">
    <app-header />
    <app-toast />
    <main class="flex-grow">
        <router-outlet />
    </main>
    <app-footer />
</div>
